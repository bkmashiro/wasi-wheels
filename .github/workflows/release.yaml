name: Release
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - uses: actions/setup-node@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache wasi-sdk
        uses: actions/cache@v4
        with:
          path: build/wasi-sdk
          key: wasi-sdk-33-${{ runner.os }}-${{ runner.arch }}

      - name: Cache CPython build (wasi + src + host)
        uses: actions/cache@v4
        with:
          path: |
            build/cpython-wasi
            build/cpython-src
            build/cpython-host
          key: cpython-3.14.0-wasi-sdk-33-${{ runner.os }}-${{ runner.arch }}

      - name: Cache Cargo registry and Rust targets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            pydantic-core/src/target
            tiktoken/src/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pydantic-core/src/Cargo.lock', 'tiktoken/src/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build prerequisites (wasi-sdk + CPython)
        shell: bash
        run: make prerequisites

      - name: Cache numpy wheel
        id: cache-numpy
        uses: actions/cache@v4
        with:
          path: build/numpy-wasi.tar.gz
          key: numpy-wasi-cpython-3.14.0-wasi-33-${{ hashFiles('numpy/**') }}

      - name: Build numpy
        if: steps.cache-numpy.outputs.cache-hit != 'true'
        shell: bash
        run: make numpy

      - name: Cache pydantic_core wheel
        id: cache-pydantic
        uses: actions/cache@v4
        with:
          path: build/pydantic_core-wasi.tar.gz
          key: pydantic-wasi-cpython-3.14.0-wasi-33-${{ hashFiles('pydantic-core/**') }}

      - name: Build pydantic_core
        if: steps.cache-pydantic.outputs.cache-hit != 'true'
        shell: bash
        run: make pydantic

      - name: Cache regex wheel
        id: cache-regex
        uses: actions/cache@v4
        with:
          path: build/regex-wasi.tar.gz
          key: regex-wasi-cpython-3.14.0-wasi-33-${{ hashFiles('regex/**') }}

      - name: Build regex
        if: steps.cache-regex.outputs.cache-hit != 'true'
        shell: bash
        run: make regex

      - name: Cache tiktoken wheel
        id: cache-tiktoken
        uses: actions/cache@v4
        with:
          path: build/tiktoken-wasi.tar.gz
          key: tiktoken-wasi-cpython-3.14.0-wasi-33-${{ hashFiles('tiktoken/**') }}

      - name: Build tiktoken
        if: steps.cache-tiktoken.outputs.cache-hit != 'true'
        shell: bash
        run: make tiktoken

      - name: Cache Pillow wheel
        id: cache-pillow
        uses: actions/cache@v4
        with:
          path: build/Pillow-wasi.tar.gz
          key: pillow-wasi-cpython-3.14.0-wasi-33-${{ hashFiles('pillow/**') }}

      - name: Build Pillow
        if: steps.cache-pillow.outputs.cache-hit != 'true'
        shell: bash
        run: make pillow

      - name: Validate Pillow and tiktoken WASM modules
        run: |
          # wasmtime dlopen is not supported for standalone run — instead validate
          # that each .so in the wheel is a well-formed WASM module by checking:
          #   1. WASM magic bytes (00 61 73 6d)
          #   2. wasmtime compile --dry-run (validates the module without running it)

          mkdir -p /tmp/wasi-smoke
          tar xzf build/Pillow-wasi.tar.gz   -C /tmp/wasi-smoke
          tar xzf build/tiktoken-wasi.tar.gz -C /tmp/wasi-smoke

          # Install wasm-tools for validation
          curl -fsSL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.224.0/wasm-tools-v1.224.0-x86_64-linux.tar.gz \
            | tar xz -C /tmp
          sudo cp /tmp/wasm-tools-v1.224.0-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools

          PASS=0; FAIL=0
          for so in $(find /tmp/wasi-smoke -name "*.so"); do
            # Check WASM magic bytes
            magic=$(xxd -p -l 4 "$so")
            if [ "$magic" = "0061736d" ]; then
              # Validate with wasm-tools
              if wasm-tools validate "$so" 2>&1; then
                echo "[PASS] $so"
                PASS=$((PASS+1))
              else
                echo "[FAIL] $so — wasm-tools validate failed"
                FAIL=$((FAIL+1))
              fi
            else
              echo "[FAIL] $so — not a WASM module (magic=$magic)"
              FAIL=$((FAIL+1))
            fi
          done

          echo ""
          echo "WASM validation: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ]

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
            name: wasi-wheels
            path: build/*-wasi.tar.gz

      - name: Upload binary to Github release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*-wasi.tar.gz
          tag: ${{ github.ref }}

  update_canary_release:
    name: Update canary release
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
            name: wasi-wheels

      - name: Publish latest (canary) release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing latest release + tag if present (ignore errors)
          gh release delete latest --repo ${{ github.repository }} --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          # Create fresh latest release with all wheel tarballs
          gh release create latest *.tar.gz \
            --repo ${{ github.repository }} \
            --title "Development Build" \
            --notes "Latest WASI wheels built from \`main\` (numpy, pydantic_core, regex, tiktoken, Pillow for CPython 3.14 / wasm32-wasip1)" \
            --prerelease
