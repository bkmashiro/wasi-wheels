name: Release
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - uses: actions/setup-node@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache wasi-sdk and CPython build
        id: cache-wasi-build
        uses: actions/cache@v4
        with:
          path: build/cpython-wasi
          key: cpython-wasi-3.14.0-wasi-sdk-33-${{ runner.os }}-${{ runner.arch }}

      - name: Build prerequisites (wasi-sdk + CPython)
        shell: bash
        run: make prerequisites

      - name: Build numpy
        shell: bash
        run: make numpy

      - name: Build pydantic_core
        shell: bash
        run: make pydantic

      - name: Build regex
        shell: bash
        run: make regex

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
            name: wasi-wheels
            path: build/*-wasi.tar.gz

      - name: Upload binary to Github release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*-wasi.tar.gz
          tag: ${{ github.ref }}

  update_canary_release:
    name: Update canary release
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
            name: wasi-wheels

      - name: Delete canary tag (ignore if not exists)
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: canary

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build"
          files: |
            *.tar.gz
            *.txt
            *.whl
        if: github.ref == 'refs/heads/main'
