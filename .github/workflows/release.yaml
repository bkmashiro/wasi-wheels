name: Release
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - uses: actions/setup-node@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache wasi-sdk
        uses: actions/cache@v4
        with:
          path: build/wasi-sdk
          key: wasi-sdk-33-${{ runner.os }}-${{ runner.arch }}

      - name: Cache CPython build (wasi + src + host)
        uses: actions/cache@v4
        with:
          path: |
            build/cpython-wasi
            build/cpython-src
            build/cpython-host
          key: cpython-3.14.0-wasi-sdk-33-${{ runner.os }}-${{ runner.arch }}

      - name: Cache Cargo registry and Rust targets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            pydantic-core/src/target
            tiktoken/src/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pydantic-core/src/Cargo.lock', 'tiktoken/src/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build prerequisites (wasi-sdk + CPython)
        shell: bash
        run: make prerequisites

      - name: Build numpy
        shell: bash
        run: make numpy

      - name: Build pydantic_core
        shell: bash
        run: make pydantic

      - name: Build regex
        shell: bash
        run: make regex

      - name: Build tiktoken
        shell: bash
        run: make tiktoken

      - name: Build Pillow
        shell: bash
        run: make pillow

      - name: Smoke-test Pillow and tiktoken with wasmtime
        continue-on-error: true
        run: |
          # Install wasmtime (same version as integration test)
          curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v44.0.1/wasmtime-v44.0.1-x86_64-linux.tar.xz \
            | tar xJ -C /tmp
          sudo cp /tmp/wasmtime-v44.0.1-x86_64-linux/wasmtime /usr/local/bin/wasmtime
          wasmtime --version

          # CPython WASM install dir (absolute — same path that python3.14 binary expects)
          CPYTHON_INSTALL=$(realpath build/cpython-wasi/install)
          PYTHON_WASM="$CPYTHON_INSTALL/bin/python3.14"
          echo "CPython WASM: $PYTHON_WASM"
          file "$PYTHON_WASM"

          # Extract Pillow and tiktoken wheels to a test directory
          mkdir -p /tmp/wasi-smoke
          tar xzf build/Pillow-wasi.tar.gz   -C /tmp/wasi-smoke
          tar xzf build/tiktoken-wasi.tar.gz -C /tmp/wasi-smoke
          echo "Wheels in /tmp/wasi-smoke:"
          ls /tmp/wasi-smoke/

          PASS=0; FAIL=0

          run_test() {
            local label="$1"; shift
            echo "=== $label ==="
            if wasmtime run \
                --dir "$CPYTHON_INSTALL" \
                --dir /tmp/wasi-smoke::/wasi-wheels \
                "$PYTHON_WASM" -- "$@" 2>&1; then
              echo "[PASS] $label"; PASS=$((PASS+1))
            else
              echo "[FAIL] $label (exit $?)"; FAIL=$((FAIL+1))
            fi
          }

          run_test "Pillow" -c "
          import sys; sys.path.insert(0, '/wasi-wheels')
          from PIL import Image, __version__ as pil_ver
          img = Image.new('RGB', (8, 8), color=(255, 0, 0))
          assert img.size == (8, 8), f'unexpected size {img.size}'
          print('Pillow', pil_ver, 'OK — Image.new', img.size)
          "

          run_test "tiktoken" -c "
          import sys; sys.path.insert(0, '/wasi-wheels')
          import tiktoken._tiktoken as _tt
          print('tiktoken native module OK, CoreBPE:', hasattr(_tt, 'CoreBPE'))
          "

          echo ""
          echo "Smoke-test results: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ] || echo "Some tests failed — see output above (non-blocking for now)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
            name: wasi-wheels
            path: build/*-wasi.tar.gz

      - name: Upload binary to Github release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*-wasi.tar.gz
          tag: ${{ github.ref }}

  update_canary_release:
    name: Update canary release
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
            name: wasi-wheels

      - name: Publish latest (canary) release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing latest release + tag if present (ignore errors)
          gh release delete latest --repo ${{ github.repository }} --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          # Create fresh latest release with all wheel tarballs
          gh release create latest *.tar.gz \
            --repo ${{ github.repository }} \
            --title "Development Build" \
            --notes "Latest WASI wheels built from \`main\` (numpy, pydantic_core, regex, tiktoken, Pillow for CPython 3.14 / wasm32-wasip1)" \
            --prerelease
