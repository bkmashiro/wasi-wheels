name: Release
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - uses: actions/setup-node@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache wasi-sdk
        uses: actions/cache@v4
        with:
          path: build/wasi-sdk
          key: wasi-sdk-33-${{ runner.os }}-${{ runner.arch }}

      - name: Cache CPython WASI build
        uses: actions/cache@v4
        with:
          path: build/cpython-wasi
          key: cpython-wasi-3.14.0-wasi-sdk-33-${{ runner.os }}-${{ runner.arch }}

      - name: Cache Cargo registry and pydantic-core target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            pydantic-core/src/target
          key: cargo-pydantic-${{ runner.os }}-${{ hashFiles('pydantic-core/src/Cargo.lock') }}
          restore-keys: |
            cargo-pydantic-${{ runner.os }}-

      - name: Build prerequisites (wasi-sdk + CPython)
        shell: bash
        run: make prerequisites

      - name: Build numpy
        shell: bash
        run: make numpy

      - name: Build pydantic_core
        shell: bash
        run: make pydantic

      - name: Build regex
        shell: bash
        run: make regex

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
            name: wasi-wheels
            path: build/*-wasi.tar.gz

      - name: Upload binary to Github release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*-wasi.tar.gz
          tag: ${{ github.ref }}

  update_canary_release:
    name: Update canary release
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
            name: wasi-wheels

      - name: Publish latest (canary) release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing latest release + tag if present (ignore errors)
          gh release delete latest --repo ${{ github.repository }} --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          # Create fresh latest release with all wheel tarballs
          gh release create latest *.tar.gz \
            --repo ${{ github.repository }} \
            --title "Development Build" \
            --notes "Latest WASI wheels built from \`main\` (numpy, pydantic_core, regex for CPython 3.14 / wasm32-wasip1)" \
            --prerelease
